# BilldDesk Server 反向代理配置
# - 80 端口：仅做 HTTPS 重定向
# - 443 端口：把 HTTP API + Socket.io WSS 都代理到 server:4200
#
# SSL 证书放：./docker/nginx/cert/fullchain.pem 和 privkey.pem
# 没证书的话临时改 server_name 为 _ 直接用 80 端口（仅 dev 测试，wss 必须 https）

# ===== HTTP → HTTPS 跳转（生产用）=====
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 让 certbot 续签能走 webroot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== HTTPS 主入口 =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;   # 改成你的域名 e.g. api.example.com

    # SSL 证书（用 BT 申请的 Let's Encrypt 拷到这里，或用 certbot 自动续签）
    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Socket.io / WSS（信令） —— 必须在 / 之前，否则被 / 抢走
    location /socket.io/ {
        proxy_pass http://server:4200/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接保活
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTP API
    location / {
        proxy_pass http://server:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
