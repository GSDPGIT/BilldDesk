# BilldDesk Server · 宝塔 Windows 原生部署 Nginx vhost 模板
#
# 用法：
#   1. 宝塔 → 网站 → 添加站点 → 域名填 api.你的域名.com，PHP 选纯静态
#   2. 站点添加成功后 → 设置 → SSL → Let's Encrypt → 申请并部署
#   3. 设置 → 配置文件 → 把下方整个 server { } 段贴进去覆盖宝塔生成的
#   4. 把 ${...} 占位符替换为实际值
#   5. 保存。宝塔会自动 reload nginx
#
# 占位符替换：
#   ${YOUR_DOMAIN}     = api.example.com
#   ${SSL_CERT_PATH}   = 宝塔 SSL 后会显示证书路径，通常是
#                        C:/BtSoft/panel/vhost/cert/${YOUR_DOMAIN}/fullchain.pem
#   ${SSL_KEY_PATH}    = C:/BtSoft/panel/vhost/cert/${YOUR_DOMAIN}/privkey.pem
#   ${SERVER_PORT}     = 4200（与 ecosystem.config.cjs 里 NODE_APP_RELEASE_PROJECT_PORT 一致）

# ===== HTTP → HTTPS 重定向 =====
server {
    listen 80;
    server_name ${YOUR_DOMAIN};
    rewrite ^(.*)$ https://${host}$1 permanent;
}

# ===== HTTPS 主入口 =====
server {
    listen 443 ssl http2;
    server_name ${YOUR_DOMAIN};

    # SSL（宝塔申请后会自动填这两行，可以直接用宝塔生成的）
    ssl_certificate     ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传文件大小（截图/录屏）
    client_max_body_size 50M;

    # ============ 关键：Socket.io / WSS 走 upgrade ============
    # 必须放在 / 之前，否则被 / 抢走
    location /socket.io/ {
        proxy_pass http://127.0.0.1:${SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;       # WebSocket 长连接保活
        proxy_send_timeout 3600s;
    }

    # ============ HTTP API ============
    location / {
        proxy_pass http://127.0.0.1:${SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 宝塔默认会有一些 access_log / error_log 行，保留即可
    access_log  C:/BtSoft/wwwlogs/${YOUR_DOMAIN}.log;
    error_log   C:/BtSoft/wwwlogs/${YOUR_DOMAIN}.error.log;
}
